# Base PostgreSQL LOCAL solo para desarrollo y pruebas (NFR-06). En la entrega, la base vive
# en la nube; esta sirve para probar el cargador y las funciones sin tocarla.
name: municipios-serverless

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: municipios
      POSTGRES_USER: municipios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo-local}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U municipios -d municipios"]
      interval: 3s
      timeout: 3s
      retries: 20
